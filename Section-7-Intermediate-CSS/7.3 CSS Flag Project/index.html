<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    div.flag{
      background-color: red;
      width: 900px;
      height: 600px;
      position: relative;
    }
    p{
      font-size: 80px;
      margin: 0;
    }
    div.flag>p{
      text-align: center;
      color:white;
    }
    div div{
      background-color: blue;
      height: 300px;
      width: 100%;
      margin-top: 80px;
      margin-bottom:20%;
      positon:absolute;

    }
    div>div>p{
      position: absolute;
      color: black;
      text-align: center;
      width: 200px;
      
    }
    div div div {  
      background-color:white;
      border-radius: 50%;
      height: 200px;
      width: 200px;
      margin-left: 40%;
    }

  </style>
</head>

  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>

</html>
